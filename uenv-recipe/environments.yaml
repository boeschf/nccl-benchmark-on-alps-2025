test_mpi-env:
  compiler:
      - toolchain: gcc
        spec: gcc
  mpi:
      spec: cray-mpich@8.1.32
      gpu: cuda
  unify: true
  specs:
  - gcc
  - cray-mpich
  - cuda
  - nccl-tests
  - nccl
  - aws-ofi-nccl@1.14.0
  - cmake
  variants:
  - +mpi
  - +cuda
  - cuda_arch=90
  views:
    default:
      link: all
      uenv:
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
